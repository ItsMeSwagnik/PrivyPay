name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Contracts (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: Build contracts
        run: cargo build --release --target wasm32v1-none

      - name: Run tests
        run: cargo test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vendor bb.js
        run: pnpm vendor:bb

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_PAYROLL_BATCH_CONTRACT: ${{ secrets.NEXT_PUBLIC_PAYROLL_BATCH_CONTRACT }}
          NEXT_PUBLIC_INVOICE_VAULT_CONTRACT: ${{ secrets.NEXT_PUBLIC_INVOICE_VAULT_CONTRACT }}
